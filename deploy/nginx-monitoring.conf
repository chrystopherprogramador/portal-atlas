    # ==================== MONITORAMENTO ====================
    # Todos protegidos por auth_request que valida sessao do portal.

    # Endpoint interno de auth (nao acessivel externamente diretamente)
    location = /_auth_portal {
        internal;
        proxy_pass              http://127.0.0.1:8080/auth/check;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        Cookie $http_cookie;
    }

    # Grafana
    location ^~ /grafana/ {
        auth_request /_auth_portal;
        error_page 401 = @login_redirect;
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }
    location /grafana/api/live/ {
        auth_request /_auth_portal;
        error_page 401 = @login_redirect;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # Prometheus UI
    location ^~ /prometheus/ {
        auth_request /_auth_portal;
        error_page 401 = @login_redirect;
        proxy_pass       http://127.0.0.1:9090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Alertmanager UI
    location ^~ /alertmanager/ {
        auth_request /_auth_portal;
        error_page 401 = @login_redirect;
        proxy_pass       http://127.0.0.1:9093;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }
