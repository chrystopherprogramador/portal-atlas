# ATLAS Portal - HTTPS, acessivel somente da LAN + VPN
server {
    listen 172.16.3.100:443 ssl;
    listen 10.8.0.1:443     ssl;
    listen 127.0.0.1:443    ssl;
    server_name atlas atlas.texasco.local 172.16.3.100 10.8.0.1;

    ssl_certificate     /etc/ssl/atlas-portal/atlas.crt;
    ssl_certificate_key /etc/ssl/atlas-portal/atlas.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    access_log /var/log/nginx/portal-access.log;
    error_log  /var/log/nginx/portal-error.log;

    location /static/ {
        alias /opt/atlas-portal/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Redirect HTTP -> HTTPS (somente interno)
server {
    listen 172.16.3.100:80;
    listen 10.8.0.1:80;
    server_name _;
    return 301 https://$host$request_uri;
}
