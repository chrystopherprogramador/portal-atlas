# /etc/vsftpd.conf -- Atlas Portal
# Servidor FTP local; sem anonimo, somente usuarios do grupo ftpusers,
# com chroot na propria home (/srv/ftp/<user>).

listen=YES
listen_ipv6=NO

# Sem anonimo
anonymous_enable=NO

# Usuarios locais
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES

# Logging
xferlog_enable=YES
xferlog_std_format=NO
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=YES

# Conexao
connect_from_port_20=YES
idle_session_timeout=600
data_connection_timeout=120
ftpd_banner=ATLAS FTP - acesso restrito

# Restringir login a quem esta na lista
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Chroot - usuario fica preso na propria home
chroot_local_user=YES
allow_writeable_chroot=YES

# PAM
pam_service_name=vsftpd

# Modo passivo (NAT-friendly)
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100
# pasv_address sera ajustado em runtime se houver IP publico

# TLS opcional (gera cert no install)
ssl_enable=YES
rsa_cert_file=/etc/ssl/atlas-portal/atlas.crt
rsa_private_key_file=/etc/ssl/atlas-portal/atlas.key
allow_anon_ssl=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
ssl_ciphers=HIGH

seccomp_sandbox=NO
